name: build-breakfront-android

# BREAKFRONT 定制构建：镜像 FCL 官方 build 步骤，构建前把完整的 BREAKFRONT 客户端模组
# 与预置服务器写进 APK 资源，产出「开箱即玩」的品牌 APK。
# 注：FCL 官方 CI 在 ubuntu-latest 上不额外装 Android SDK 即可构建，本工作流沿用同样环境。

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Stage BREAKFRONT assets (client mods + preset server)
        run: |
          set -e
          python3 pack/build_android_assets.py             --mods-dir FCL/src/main/assets/breakfront/clientmods             --server-dat FCL/src/main/assets/breakfront/servers.dat             || (echo "retry after transient failure..."; sleep 15; python3 pack/build_android_assets.py                  --mods-dir FCL/src/main/assets/breakfront/clientmods                  --server-dat FCL/src/main/assets/breakfront/servers.dat)
          ls FCL/src/main/assets/breakfront
          ls FCL/src/main/assets/breakfront/clientmods | head -40

      - name: Build debug apk (fork -> assemblefordebug)
        run: |
          chmod +x gradlew
          ./gradlew assemblefordebug -Darch=all --no-daemon

      - name: Upload apk
        uses: actions/upload-artifact@v6
        with:
          name: breakfront-launcher-android
          path: FCL/build/outputs/apk/*/*
